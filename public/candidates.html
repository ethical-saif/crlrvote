<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Registration - CR/LR Voting</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Candidate Registration</h1>
      <nav><a href="/">Back to Vote</a></nav>
    </header>

    <div id="msg" class="msg hidden"></div>

    <div class="card">
      <form id="register-form">
        <label for="rollNo">Roll number</label>
        <input type="text" id="rollNo" name="rollNo" placeholder="25280-cm-073" autocomplete="off" required>

        <label for="name">Name (optional)</label>
        <input type="text" id="name" name="name" placeholder="Your name">

        <label for="position">Position</label>
        <select id="position" name="position" required>
          <option value="">Select position</option>
          <option value="CR">CR</option>
          <option value="LR">LR</option>
        </select>

        <label for="manifesto">Manifesto (optional, max 200 chars)</label>
        <textarea id="manifesto" name="manifesto" maxlength="200" placeholder="Short manifesto"></textarea>

        <button id="register-btn" type="submit">Register</button>
      </form>
    </div>
  </div>
  <script src="/js/candidates.js"></script>
</body>
</html>
