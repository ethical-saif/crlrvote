<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CR/LR Voting</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>CR / LR Voting</h1>
      <nav><a href="/candidates">Candidate Registration</a></nav>
    </header>

    <div id="msg" class="msg hidden"></div>
    <div id="loading" class="card">Loading...</div>

    <div id="login-view" class="card hidden">
      <h2>Enter your roll number</h2>
      <label for="roll-input">Roll number</label>
      <input type="text" id="roll-input" placeholder="25280-cm-073" autocomplete="off">
      <button id="login-btn" type="button">Continue</button>
    </div>

    <div id="voted-view" class="card hidden">
      <h2>Thank you!</h2>
      <p id="voted-text" class="msg success">You have already voted. Thank you!</p>
      <div class="actions"><button id="logout-btn-voted" type="button" class="secondary">Logout</button></div>
    </div>

    <div id="vote-view" class="hidden">
      <div class="card">
        <p id="welcome-text"></p>
        <div class="actions"><button id="logout-btn" type="button" class="secondary">Logout</button></div>
      </div>

      <div id="no-candidates" class="card hidden">
        <p>No candidates have registered yet.</p>
      </div>

      <form id="vote-form" class="hidden">
        <div id="cr-section" class="card section hidden">
          <h2>CR Candidates</h2>
          <div id="cr-list" class="candidate-list"></div>
        </div>
        <div id="lr-section" class="card section hidden">
          <h2>LR Candidates</h2>
          <div id="lr-list" class="candidate-list"></div>
        </div>
        <div class="card">
          <p class="muted">Your vote is final and cannot be changed.</p>
          <button id="submit-vote-btn" type="submit">Submit Vote</button>
        </div>
      </form>
    </div>
  </div>
  <script src="/js/index.js"></script>
</body>
</html>
