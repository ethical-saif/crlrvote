<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Results - CR/LR Voting</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Admin Results</h1>
      <nav><a href="/">Home</a></nav>
    </header>

    <div id="msg" class="msg hidden"></div>

    <div id="key-card" class="card">
      <label for="admin-key">Admin key</label>
      <input type="text" id="admin-key" autocomplete="off">
      <button id="load-btn" type="button">Load Results</button>
    </div>

    <div id="results" class="hidden">
      <div class="card">
        <p id="summary"></p>
      </div>
      <div class="card">
        <h2>Candidates</h2>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr><th>Position</th><th>Name</th><th>Roll No</th><th>Votes</th><th>Manifesto</th></tr>
            </thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/admin.js"></script>
</body>
</html>
