services:
  - type: web
    name: crlrvote
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
